<script type="module">
const V='2.26.16',$=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch{}}};
const S=Object.assign({ghost:false,keep:true,dnd:false,showId:false,stream:false,theme:'auto'},JSON.parse(ls.get('tg_s')||'{}'));
const AYU=Object.assign({del:{},hist:{}},JSON.parse(ls.get('tg_ayu')||'{}')),HID=new Set(JSON.parse(ls.get('tg_hid')||'[]'));

let client,Api,D=[],cur=null,M={},NM={},PH={},BL={},reply=null,edit=null,me=null,lastTyp=0,typingAt=0;const MINE=new Set();

const kind=e=>e.className==='User'?'u':e.className==='Channel'?'ch':'c',ename=e=>e.title||[e.firstName,e.lastName].filter(Boolean).join(' ')||e.username||'Без имени';

/* ===== сообщения ===== */
function norm(m){const md=m.media,c=md?.className;let ty='',em='';
 if(c==='MessageMediaPhoto')ty='photo';else if(c==='MessageMediaDocument'){const at=md.document?.attributes||[],st=at.find(a=>a.className==='DocumentAttributeSticker'),au=at.find(a=>a.className==='DocumentAttributeAudio');ty=st?'sticker':au?.voice?'voice':au?'audio':at.some(a=>a.className==='DocumentAttributeVideo')?'video':'doc';em=st?.alt||''}else if(c)ty='other';
 const s=m.sender,sid=String(m.senderId??m.fromId?.userId??''),nm=s?(s.title||[s.firstName,s.lastName].filter(Boolean).join(' ')):'';if(nm&&sid)NM[sid]=nm;
 return{id:m.id,t:m.message||'',out:!!m.out,ts:m.date*1000,edit:!!m.editDate,ty,em,rid:m.replyTo?.replyToMsgId||0,sid,name:nm||NM[sid]||'',o:m}}
const lbl=n=>n.t||({photo:'📷 Фото',voice:'🎤 Голосовое',audio:'🎵 Аудио',video:'🎬 Видео',sticker:(n.em||'')+' Стикер',doc:'📎 Файл',other:'📎 Вложение'}[n.ty]||'');
const BIG=/^(\p{Extended_Pictographic}\uFE0F?){1,3}$/u,md=s=>E(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
function renderMsgs(soft){if(!cur)return;const box=$('#msgs'),mm=M[cur.key]||{},q=$('#sq').value.toLowerCase(),bottom=box.scrollHeight-box.scrollTop-box.clientHeight<100;
 const list=Object.values(mm).sort((a,b)=>a.id-b.id).filter(n=>!HID.has(cur.key+':'+n.id)&&(S.keep||!n.del)&&(!q||n.t.toLowerCase().includes(q)));let h='',pd='';
 list.forEach((n,i)=>{const nx=list[i+1],pr=list[i-1],tail=!nx||nx.out!==n.out||nx.sid!==n.sid||nx.ts-n.ts>300000,gap=!pr||pr.out!==n.out||pr.sid!==n.sid||n.ts-pr.ts>300000,d=dl(n.ts),hk=cur.key+':'+n.id,rq=n.rid&&mm[n.rid],big=n.ty==='sticker'&&n.em&&!n.t||(n.t&&!n.ty&&BIG.test(n.t.trim()));
  let med='';if(n.ty==='photo'||n.ty==='voice'){const b=BL[hk];med=b?(n.ty==='photo'?`<img src="${b}">`:`<audio controls src="${b}"></audio>`):`<button class="ld" data-l="${n.id}">${n.ty==='photo'?'📷 Показать фото':'🎤 Воспроизвести'}</button>`}else if(n.ty&&n.ty!=='sticker')med=`<span class="ld">${lbl(n)}</span>`;
  if(d!==pd){h+=`<div class="dp">${d}</div>`;pd=d}

  ${rq?`<div class="rp"><b>${E(rq.name||(rq.out?'Вы':''))}</b><br>${E(lbl(rq).slice(0,70))}</div>`:''}${med}<span class="tx">${big&&n.ty==='sticker'?E(n.em):md(n.ty&&n.ty!=='sticker'&&!n.t?'':n.t)}</span>
  <span class="mt">${n.del?'🗑 ':''}${n.edit||AYU.hist[hk]?'изм. ':''}${S.showId?n.id+' ':''}${tm(n.ts)}${n.out?' <span class="ck">✓</span>':''}</span></div>`});
 $('#msgs').innerHTML=h||'<div id="empty">Сообщений нет</div>';if(bottom||!soft)box.scrollTop=box.scrollHeight;hdr()}

 if(Date.now()-typingAt<5000)s='печатает…';else if(cur.isUser)s=st==='UserStatusOnline'?'в сети':st==='UserStatusOffline'?'был(а) '+tm(e.status.wasOnline*1000):'был(а) недавно';else s=(e.participantsCount?e.participantsCount+' уч.':'')||'группа';$('#hs').textContent=s}

 const m=e.target.closest('.m');if(m&&!e.target.closest('a,audio'))menu(M[cur.key][m.dataset.id])};
$('#msgs').onscroll=e=>{const b=e.target;$('#down').style.display=b.scrollHeight-b.scrollTop-b.clientHeight>300?'grid':'none'};$('#down').onclick=()=>{$('#msgs').scrollTop=1e9};

 sheet(`<div class="card" style="border:0"><button class="it" data-a="reply">↩ Ответить</button><button class="it" data-a="copy">⧉ Копировать</button>${n.out&&!n.del&&n.t?'<button class="it" data-a="edit">✏ Изменить</button>':''}${!n.del?'<button class="it" data-a="del">🗑 Удалить'+(n.out?' у всех':'')+'</button>':''}<button class="it" data-a="hide">🙈 Удалить у себя</button>${h.length?`<div class="it" style="display:block"><b>История правок</b><small>${h.map(E).join('<br>→ ')}</small></div>`:''}</div>`);

const setCtx=()=>{const c=$('#ctx');c.style.display=reply||edit?'block':'none';c.innerHTML=edit?'✏ Редактирование <a href="#" id="x" style="float:right">✕</a>':reply?`↩ ${E(lbl(reply).slice(0,50))} <a href="#" id="x" style="float:right">✕</a>`:'';const x=$('#x');if(x)x.onclick=e=>{e.preventDefault();reply=edit=null;$('#inp').value='';setCtx()}};
async function send(){const t=$('#inp').value.trim();if(!cur||!t)return;$('#inp').value='';$('#send').innerHTML=SEND;
 try{if(edit){await client.editMessage(cur.e,{message:edit.id,text:t});edit=null}else await client.sendMessage(cur.e,{message:t,...(reply?{replyTo:reply.id}:{})})}catch(e){alert('Ошибка: '+e.message)}reply=null;setCtx()}
$('#send').innerHTML=SEND;$('#send').onclick=send;$('#inp').onkeydown=e=>{if(e.key==='Enter')send()};
$('#inp').oninput=()=>{if(S.ghost||!cur||Date.now()-lastTyp<4000)return;lastTyp=Date.now();client.invoke(new Api.messages.SetTyping({peer:cur.e,action:new Api.SendMessageTypingAction()})).catch(()=>{})};
$('#emo').onclick=()=>{sheet(`<div class="ems">${'😀😂😍🥰😎🤔😭😡👍👎👏🙏🔥❤️💔🎉✨💯🤝👀🚀🍕☕🎮'.match(/\p{Extended_Pictographic}\uFE0F?/gu).map(e=>`<button>${e}</button>`).join('')}</div>`);$('#sbody').onclick=e=>{if(e.target.tagName==='BUTTON'){$('#inp').value+=e.target.textContent;$('#inp').focus()}}};
$('#srch').onclick=()=>{const s=$('#sq');s.style.display=s.style.display==='none'?'block':'none';s.value='';renderMsgs(true)};$('#sq').oninput=()=>renderMsgs(true);
$('#back').onclick=()=>{document.body.classList.remove('open');cur=null;drawList()};
/* ===== чаты ===== */
async function openChat(key){const d=D.find(x=>x.key===key);if(!d)return;cur=d;d.unread=0;reply=edit=null;setCtx();document.body.classList.add('open');closePanel();
 $('#hav').innerHTML=av(key,d.name,PH[key]);$('#ht').textContent=d.name;$('#inp').disabled=false;drawList();
 try{const arr=await client.getMessages(d.e,{limit:70}),mm=M[key]??={};for(const m of arr){if(m.className!=='Message')continue;const n=norm(m);if(!mm[n.id]?.del)mm[n.id]=n}
  for(const [id,n] of Object.entries(AYU.del[key]||{})){if(!mm[id])mm[id]={...n,del:1};else mm[id].del=1}}catch(e){alert('Не удалось загрузить: '+e.message)}
 renderMsgs(false);markRead()}
const markRead=()=>{if(S.ghost||!cur||document.hidden)return;client.markAsRead(cur.e).catch(()=>{})};document.addEventListener('visibilitychange',markRead);
const sortD=()=>D.sort((a,b)=>(b.pinned-a.pinned)||(b.date-a.date));
function drawList(){const q=$('#cs').value.trim().toLowerCase();
 $('#cl').innerHTML=D.filter(d=>!q||d.name.toLowerCase().includes(q)).map(d=>`<button class="row ${cur?.key===d.key?'on':''}" data-id="${d.key}">${av(d.key,d.name,PH[d.key])}<div class="c"><div><b>${E(d.name)}</b></div><div><small>${d.last?(d.last.out?'Вы: ':'')+E(lbl(d.last).slice(0,60)):''}</small></div></div><div style="text-align:right"><small>${d.date?(Date.now()-d.date<864e5?tm(d.date):new Date(d.date).toLocaleDateString('ru',{day:'numeric',month:'short'})):''}</small>${d.unread&&cur?.key!==d.key?`<div><span class="bd">${d.unread}</span></div>`:''}</div></button>`).join('')||'<div class="mu" style="padding:40px;text-align:center">Загрузка чатов…</div>';
 document.title=(D.reduce((s,d)=>s+(d.unread||0),0)?`(${D.reduce((s,d)=>s+(d.unread||0),0)}) `:'')+'WrunetGram'}
$('#cs').oninput=drawList;$('#cl').onclick=e=>{const b=e.target.closest('[data-id]');if(b)openChat(b.dataset.id)};
let ldT;const loadD=()=>{clearTimeout(ldT);ldT=setTimeout(async()=>{const ds=await client.getDialogs({limit:100});D=ds.filter(d=>d.entity).map(d=>({key:kind(d.entity)+d.entity.id,e:d.entity,name:ename(d.entity),unread:d.unreadCount||0,last:d.message?.className==='Message'?norm(d.message):null,date:(d.date||0)*1000,pinned:d.pinned?1:0,isUser:d.entity.className==='User'}));sortD();drawList();photos()},300)};
async function photos(){let n=0;for(const d of D.slice(0,40)){if(PH[d.key])continue;try{const b=await client.downloadProfilePhoto(d.e,{isBig:false});if(b&&b.length)PH[d.key]=URL.createObjectURL(new Blob([b],{type:'image/jpeg'}))}catch{}if(++n%5===0)drawList()}drawList()}
/* ===== обновления (ядро AyuGram: удалённые и правки сохраняются) ===== */
function touch(k,n,isNew){const d=D.find(x=>x.key===k);if(!d){loadD();return}d.last=n;d.date=n.ts;if(isNew&&!n.out&&cur?.key!==k){d.unread++;if(!S.dnd&&document.hidden&&window.Notification&&Notification.permission==='granted'){try{new Notification(d.name,{body:lbl(n)})}catch{}}}
 if(isNew&&cur?.key===k&&!n.out)markRead();sortD();drawList()}
async function onUpd(u){const c=u.className;
 if(/^Update(New|Edit)(Channel)?Message$/.test(c)){const m=u.message;if(m.className!=='Message')return;const k=pkey(m.peerId),n=norm(m),isE=c.includes('Edit'),mm=M[k]??={},old=mm[n.id];
  if(isE&&old&&old.t!==n.t){(AYU.hist[k+':'+n.id]??=[]).push(old.t);saveA()}if(old?.del)n.del=1;mm[n.id]=n;touch(k,n,!isE);if(cur?.key===k)renderMsgs(true)}
 else if(c==='UpdateShortMessage'){const k='u'+u.userId,n={id:u.id,t:u.message,out:!!u.out,ts:u.date*1000,ty:'',em:'',rid:0,sid:String(u.userId),name:'',o:null};(M[k]??={})[n.id]=n;touch(k,n,true);if(cur?.key===k)renderMsgs(true)}
 else if(c==='UpdateDeleteMessages'||c==='UpdateDeleteChannelMessages'){const ck=c==='UpdateDeleteChannelMessages'?'ch'+u.channelId:null;
  for(const k of ck?[ck]:Object.keys(M))for(const id of u.messages){const n=M[k]?.[id];if(n&&!n.del&&!MINE.has(id)){n.del=1;(AYU.del[k]??={})[id]={...n,o:null}}}saveA();if(cur)renderMsgs(true);drawList()}
 else if(c==='UpdateUserTyping'&&cur?.key==='u'+u.userId){typingAt=Date.now();hdr();setTimeout(hdr,5200)}
 else if(c==='UpdateUserStatus'){const d=D.find(x=>x.key==='u'+u.userId);if(d){d.e.status=u.status;if(cur===d)hdr()}}}
/* ===== панели и настройки ===== */
const closePanel=()=>$('#panel').style.display='none';$('#pback').onclick=closePanel;
const nightOn=()=>S.theme==='dark'||(S.theme==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);
function drawer(open){const it=(l,a,x='')=>`<button class="it" data-act="${a}"><span>${l}</span>${x}</button>`;
 $('#drawer').innerHTML=`<div style="padding:18px;background:var(--h)"><div style="font-size:20px;font-weight:800;color:var(--brand);margin-bottom:12px">WrunetGram</div>${av('me',me?.firstName)}<div style="font-weight:600;margin-top:10px">${E([me?.firstName,me?.lastName].filter(Boolean).join(' '))}</div><small class="mu">${me?.username?'@'+E(me.username):''}</small></div>`+it('⚙ Настройки','settings')+it('🌙 Ночной режим','night',`<span class="sw ${nightOn()?'on':''}"></span>`)+it('↪ Выйти','out');
 const s=$('#scrim');if(open){s.style.display='block';requestAnimationFrame(()=>s.classList.add('on'))}else{s.classList.remove('on');setTimeout(()=>s.style.display='none',200)}}
$('#menu').onclick=()=>drawer(true);
$('#scrim').onclick=e=>{const b=e.target.closest('[data-act]');if(!b&&e.target.id!=='scrim')return;drawer(false);const a=b?.dataset.act;if(a==='settings')settings();if(a==='night'){S.theme=nightOn()?'light':'dark';save()}
 if(a==='out'&&confirm('Выйти из аккаунта на этом устройстве?')){ls.set('tg_sess',null);location.reload()}};
function settings(){$('#panel').style.display='flex';const t=(k,l,d)=>`<button class="it" data-k="${k}"><span>${l}<small>${d}</small></span><span class="sw ${S[k]?'on':''}"></span></button>`;
 $('#pb').innerHTML=`<div class="card" style="text-align:center;padding:22px 0"><div style="display:inline-block">${av('me',me?.firstName)}</div><div style="font-size:20px;font-weight:600;margin-top:8px">${E([me?.firstName,me?.lastName].filter(Boolean).join(' '))}</div><div class="mu">${me?.username?'@'+E(me.username):''} ${me?.phone?'+'+E(me.phone):''}</div></div>
 <div class="card"><div class="sec">AyuGram</div>${t('ghost','👻 Режим призрака','Не отмечать прочитанным, не слать «печатает…», скрывать «в сети»')}${t('keep','🗑 Сохранять удалённые','Удалённые собеседниками сообщения остаются с пометкой')}${t('stream','📺 Режим стримера','Размыть имена и превью')}${t('showId','🆔 ID сообщений','Показывать ID сообщений')}<div class="it" style="display:block"><small>История правок и «Удалить у себя» — в меню сообщения. Сохраняются только сообщения, которые приложение видело, пока было открыто.</small></div></div>
 <div class="card"><div class="sec">Общие</div>${t('dnd','🔕 Не беспокоить','Без уведомлений')}<button class="it" data-k="theme"><span>Тема: <b>${{auto:'системная',light:'светлая',dark:'тёмная'}[S.theme]}</b></span>🎨</button><button class="it" data-k="notif"><span>Уведомления браузера</span>🔔</button><button class="it" data-k="api"><span>Сменить API ID / hash</span>🔧</button></div>`}
$('#pb').onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;const k=b.dataset.k;if(k==='notif')return window.Notification?.requestPermission();if(k==='api'){ls.set('tg_id',null);ls.set('tg_hash',null);ls.set('tg_sess',null);return location.reload()}
 if(k==='theme')S.theme={auto:'light',light:'dark',dark:'auto'}[S.theme];else S[k]=!S[k];save();settings();renderMsgs(true);if(k==='ghost')status()};
const status=()=>client?.invoke(new Api.account.UpdateStatus({offline:!!S.ghost})).catch(()=>{});
/* ===== старт и вход ===== */
async function boot(){
 let id=+ls.get('tg_id'),hash=ls.get('tg_hash');
 if(!id||!hash){id=+await ask('Подключение к Telegram','Нужны API ID и API hash (бесплатно): открой my.telegram.org → API development tools → Create application.<br><br>');hash=await ask('API hash','Строка из 32 символов с той же страницы');ls.set('tg_id',id);ls.set('tg_hash',hash)}
 $('#cl').innerHTML='<div class="mu" style="padding:40px;text-align:center">Подключаюсь к Telegram…</div>';
 const [tl,ss]=await Promise.all([import(`https://esm.sh/telegram@${V}`),import(`https://esm.sh/telegram@${V}/sessions`)]);Api=tl.Api;
 client=new tl.TelegramClient(new ss.StringSession(ls.get('tg_sess')||''),id,hash,{connectionRetries:5,useWSS:true,deviceModel:'WrunetGram Web'});
 await client.start({phoneNumber:()=>ask('Твой номер','В международном формате, например +79991234567'),phoneCode:()=>ask('Код из Telegram','Придёт в приложение Telegram или по SMS'),password:()=>ask('Облачный пароль','Двухэтапная проверка (если включена)','password'),onError:e=>{alert('Ошибка входа: '+(e.message||e));return true}});
 ls.set('tg_sess',client.session.save());me=await client.getMe();
 client.addEventHandler(u=>onUpd(u).catch(e=>console.warn(e)));
 await loadDlg();status();setInterval(()=>{status();for(const d of D.slice(0,5))if(d.isUser&&d.e.status)hdr()},25000)}
const loadDlg=()=>new Promise(r=>{loadD();setTimeout(r,1500)});
boot().catch(e=>{$('#reg').style.display='flex';$('#rbody').innerHTML=`<div style="font-size:30px;font-weight:800;color:var(--brand)">WrunetGram</div><h3>Не удалось подключиться</h3><p class="mu">${E(e.message||e)}</p><p class="mu" style="font-size:13px">Возможные причины: заблокирован доступ к Telegram у провайдера, не загрузилась библиотека (esm.sh) или неверный API ID/hash.</p><button class="pb" onclick="location.reload()">Повторить</button><button class="pb g" onclick="localStorage.removeItem('tg_id');localStorage.removeItem('tg_hash');location.reload()">Сменить API ID</button>`});
</script></body></html>
